<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zion Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">

    <div class="header-group">
      <div class="header-top">
        <a class="logo" href="/">Zion Blog</a>
      </div>
  
      <nav class="main-nav">
        <span> Welcome Back</span>
      </nav>

    </div>


  </header>
  <form class="form" id="reset-password-form" method="POST">

      <h1>Create a new password</h1> 
      <p class="page-description"> Choose a new password for your Zion Blog account.</p>
    
      <input type="password" name="password" placeholder="Enter your new password" required minlength="8">
    
      <button class="auth-btn" id="resetPasswordBtn" type="submit">Reset Password</button>
      
      <p id="message" class="message"></p>
      
      <small> Your password must contain at least 8 characters. </small>
    </form>
    
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
