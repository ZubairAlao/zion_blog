<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zion Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header"> 

    <div class="header-group" id="navAuth">
      <div class="header-top">
        <a class="logo" href="/">Zion Blog</a>
      </div>
    </div>
  </header>
  <main id="verify-email">

    <section class="page">

      <h1>Verify Email</h1>    
    
      <p class="page-description"> Your account has been created successfully. Please verify your email address to activate your account. </p>
  
      <button class="auth-btn" id="verifyEmailBtn" type="submit">Verify Email</button>
      <p id="message" class="message"></p>

      <p class="auth-footer"> Already verified? <a href="/login.html">Log in</a> </p>
    </section>

    </main>
    
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
