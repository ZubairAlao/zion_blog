<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zion Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">

    <div class="header-group">
      <div class="header-top">
        <a class="logo" href="/">Zion Blog</a>
      </div>
  
      <nav class="main-nav">
        <a class="nav-link" href="/forgot-password.html">Forgot Password</a>  
      </nav>

    </div>


  </header>
  <form id="change-password-form" class="form" method="POST">

      <h1>Change Password</h1>    

      <p class="page-description">Enter your current password and choose a new password for your account.</p>
      
    
      <input type="password" name="currentPassword" placeholder="Current Password" required>
      <input type="password" name="newPassword" placeholder="New Password" required minlength="8">
      <input type="password" name="confirmPassword" placeholder="Confirm Password" required minlength="8">

      <small> Your new password must contain at least 8 characters. </small>
    
      <button class="auth-btn" id="changePasswordBtn" type="submit">Change Password</button>

      <p id="message" class="message"></p>
    
    </form>
    
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
