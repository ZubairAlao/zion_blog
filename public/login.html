<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zion Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header"> 

    <div class="header-group" id="navAuth">
      <div class="header-top">
        <a class="logo" href="/">Zion Blog</a>
      </div>
  
      <nav class="main-nav">
        <a class="nav-link" href="/register.html">Register</a>
        <a class="nav-link" href="/forgot-password.html">Forgot Password</a> 
      </nav>

    </div>
  </header>

  <form class="form" id="login-form" method="POST">

      <h1>Login account</h1>    
      <input type="email" id="email" name="email" placeholder="Email" required>
    
      <input type="password" name="password" placeholder="Password" required minlength="8">
    
      <button class="auth-btn" id="loginBtn" type="submit">Login</button>

      <p id="message" class="message"></p>
      <div>
        <button id="sendVerificationEmailBtn" hidden>Resend Email Link</button>
      </div>
    
    </form>
    
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
