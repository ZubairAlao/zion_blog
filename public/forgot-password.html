<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zion Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">

    <div class="header-group">
      <div class="header-top">
        <a class="logo" href="/">Zion Blog</a>
      </div>
  
      <nav class="main-nav">
        <span> Have something else in mind?
          <a href="/">click here to go back</a>
        </span>
      </nav>

    </div>


  </header>

  <form class="form" id="forgot-password-form" method="POST">

      <h1>forgot Password</h1>    

      <p class="page-description"> Enter the email address associated with your account. We'll send you a link to create a new password. </p>
      
    
      <input type="email" name="email" placeholder="you@example.com" required>
    
      <button class="auth-btn" id="forgotPasswordBtn" type="submit">Send Reset Link</button>

      <p id="message" class="message"></p>

      <p class="auth-footer"> Remember your password? <a href="/login.html">Log in</a> </p>
    
    </form>
    
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
